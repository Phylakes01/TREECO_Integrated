<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081c15" />
      <stop offset="45%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="50%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#95d5b2" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#40916c" />
      <stop offset="60%" stop-color="#74c69d" />
      <stop offset="100%" stop-color="#d8f3dc" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8f3dc" />
      <stop offset="100%" stop-color="#52b788" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95d5b2" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#52b788" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with eco border -->
  <rect x="5" y="5" width="118" height="118" rx="28" fill="url(#bgGrad)" stroke="#52b788" stroke-width="3" />

  <!-- Inner subtle glow rim -->
  <rect x="9" y="9" width="110" height="110" rx="24" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" />

  <!-- Tree / Plant & Smart Eco IoT Symbol -->
  <g filter="url(#dropShadow)">
    <!-- Soil Horizon Base -->
    <path d="M 34 95 C 48 91 80 91 94 95 C 86 100 42 100 34 95 Z" fill="#52b788" opacity="0.85" />
    
    <!-- Central Trunk / Stem -->
    <path d="M 61 94 C 61 74 63 56 64 36 C 65 56 67 74 67 94 Z" fill="url(#stemGrad)" />

    <!-- Left Main Leaf -->
    <path d="M 63 68 C 43 66 32 48 35 32 C 48 33 60 48 63 68 Z" fill="url(#leafGrad1)" />

    <!-- Right Main Leaf -->
    <path d="M 65 56 C 83 54 95 38 93 22 C 80 24 67 38 65 56 Z" fill="url(#leafGrad2)" />

    <!-- Left Small Sprout Leaf -->
    <path d="M 63 81 C 51 81 44 73 45 64 C 53 65 61 73 63 81 Z" fill="url(#leafGrad2)" />

    <!-- Top Sprout / Tech Sensor Node -->
    <circle cx="64" cy="28" r="6.5" fill="#d8f3dc" />
    <circle cx="64" cy="28" r="3.2" fill="#1b4332" />

    <!-- Smart Circuit / IoT pulse dots on leaves -->
    <circle cx="45" cy="42" r="2.8" fill="#d8f3dc" />
    <circle cx="83" cy="33" r="2.8" fill="#ffffff" />
  </g>
</svg>
